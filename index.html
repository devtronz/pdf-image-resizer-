<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Resizer – Fast & Private</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Image Resizer</h1>
      <p class="subtitle">Resize • Compress • Convert — 100% offline & private</p>
    </header>

    <!-- Upload -->
    <section class="card">
      <h2>1. Select Image</h2>
      <label class="upload-area" for="img">
        <input type="file" id="img" accept="image/*" hidden>
        <span id="uploadText">Click or drop an image here</span>
      </label>
      <p id="fileInfo" class="hint"></p>
    </section>

    <!-- Preview -->
    <section class="card">
      <h2>Preview</h2>
      <div class="preview-grid">
        <div>
          <p class="label">Original</p>
          <div class="preview-box">
            <img id="originalPreview" alt="">
          </div>
          <p id="originalInfo" class="hint"></p>
        </div>
        <div>
          <p class="label">Result</p>
          <div class="preview-box">
            <img id="resizedPreview" alt="">
          </div>
          <p id="resultInfo" class="hint"></p>
        </div>
      </div>
    </section>

    <!-- Settings -->
    <section class="card">
      <h2>2. Settings</h2>

      <div class="form-grid">
        <div class="field">
          <label>Width (px)</label>
          <input type="number" id="width" placeholder="Auto" min="1">
        </div>

        <div class="field">
          <label>Height (px)</label>
          <input type="number" id="height" placeholder="Auto" min="1">
        </div>

        <div class="field">
          <label>Aspect Ratio</label>
          <select id="aspectRatio">
            <option value="free">Keep original</option>
            <option value="square">1:1 Square</option>
            <option value="16:9">16:9</option>
            <option value="4:3">4:3</option>
            <option value="9:16">9:16</option>
            <option value="custom">Custom</option>
          </select>
        </div>

        <div class="field" id="customRatioField" style="display:none;">
          <label>Custom Ratio</label>
          <div class="ratio-inputs">
            <input type="number" id="customW" value="16" min="1">
            <span>:</span>
            <input type="number" id="customH" value="9" min="1">
          </div>
        </div>

        <div class="field">
          <label>Format</label>
          <select id="format">
            <option value="image/jpeg">JPEG (best compatibility)</option>
            <option value="image/png">PNG (lossless)</option>
            <option value="image/webp">WebP (smaller size)</option>
          </select>
        </div>

        <div class="field">
          <label>Quality: <span id="qualityLabel">85%</span></label>
          <input type="range" id="quality" min="10" max="100" value="85">
        </div>

        <div class="field">
          <label>Max File Size (optional)</label>
          <div class="size-row">
            <input type="number" id="maxSize" placeholder="e.g. 500" min="1">
            <select id="sizeUnit">
              <option value="kb">KB</option>
              <option value="mb">MB</option>
            </select>
          </div>
        </div>
      </div>
    </section>

    <!-- Action -->
    <section class="card action-card">
      <button id="processBtn" disabled>Resize Image</button>

      <div class="progress" id="progressWrap" style="display:none;">
        <div class="progress-bar">
          <div id="progressFill"></div>
        </div>
        <p id="progressText">Processing…</p>
      </div>

      <button id="downloadBtn" class="download" style="display:none;">Download Result</button>
    </section>

    <footer>
      <p>Everything runs in your browser. Files never leave your device.</p>
    </footer>
  </div>

  <script src="resizer.js"></script>
</body>
</html>
