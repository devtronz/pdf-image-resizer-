<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Resizer | Matrix</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>IMAGE RESIZER</h1>
      <p class="subtitle">Privacy-first • Offline processing</p>
    </header>

    <!-- Upload -->
    <section class="card">
      <h2>1. Select Image</h2>
      <input type="file" id="img" accept="image/*">
      <div id="fileInfo" class="hint" style="display:none; margin-top:12px;"></div>
    </section>

    <!-- Preview -->
    <section class="card">
      <h2>Preview</h2>
      <div class="preview-box">
        <div>
          <p class="preview-title">Original</p>
          <img id="originalPreview" alt="Original">
        </div>
        <div>
          <p class="preview-title">Resized</p>
          <img id="resizedPreview" alt="Resized">
        </div>
      </div>
      <div id="resultInfo" class="info-card" style="display:none;"></div>
    </section>

    <!-- Settings -->
    <section class="card">
      <h2>2. Settings</h2>

      <div class="row">
        <label>Target Width (px)</label>
        <input type="number" id="width" placeholder="e.g. 1920" min="1">
      </div>

      <div class="row">
        <label>Aspect Ratio</label>
        <select id="aspectRatio">
          <option value="free">Free (keep original)</option>
          <option value="square">1:1 Square</option>
          <option value="landscape_16_9">16:9 Landscape</option>
          <option value="photo_4_3">4:3 Photo</option>
          <option value="portrait_9_16">9:16 Portrait</option>
          <option value="custom">Custom</option>
        </select>
      </div>

      <div id="customRatioInputs" class="row" style="display:none;">
        <input type="number" id="customRatioW" value="16" min="1">
        <span>:</span>
        <input type="number" id="customRatioH" value="9" min="1">
      </div>

      <div class="row">
        <label>Output Format</label>
        <select id="outputFormat">
          <option value="image/webp">WebP</option>
          <option value="image/jpeg">JPEG</option>
          <option value="image/png">PNG</option>
        </select>
      </div>

      <div class="row">
        <label>Quality: <span id="qualityValue">85%</span></label>
        <input type="range" id="qualitySlider" min="10" max="100" value="85">
      </div>

      <div class="row">
        <label>Target File Size (optional)</label>
        <div style="display:flex; gap:10px;">
          <input type="number" id="sizeValue" placeholder="500" min="1" style="flex:1;">
          <select id="sizeUnit" style="width:90px;">
            <option value="kb">KB</option>
            <option value="mb">MB</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Action -->
    <section class="card action">
      <button id="resizeBtn">RESIZE IMAGE</button>

      <div class="progress-wrapper">
        <div id="progressText">Idle</div>
        <div class="progress-bar">
          <div id="progressFill"></div>
        </div>
      </div>

      <a id="downloadBtn" class="download-link" style="display:none;" download>DOWNLOAD RESIZED IMAGE</a>
    </section>

    <footer>
      <a href="image-resizer.html">Image Resizer</a> • 
      <a href="https://github.com/devtronz/pdf-image-resizer-">GitHub</a>
    </footer>
  </div>

  <script src="resizer.js"></script>
</body>
</html>
